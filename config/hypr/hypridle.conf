# hypridle — idle lock / screen off / suspend, and lock before every suspend
# (lid close, power menu, systemctl suspend). logind handles the lid itself;
# hypridle delays the suspend until hyprlock holds the session.

$dpms_off = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
$dpms_on  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

general {
    lock_cmd         = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = $dpms_on
    inhibit_sleep    = 3   # wait until the session is actually locked before sleeping
}

# 2 min 30: dim the screen to 10 % (only if it's brighter, never brighten it)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s >/dev/null; [ "$(brightnessctl -m | cut -d, -f4 | tr -d %)" -gt 10 ] && brightnessctl set 10%
    on-resume  = brightnessctl -r
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5 min 30: screen off
listener {
    timeout    = 330
    on-timeout = $dpms_off
    on-resume  = $dpms_on
}

# 30 min: suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
