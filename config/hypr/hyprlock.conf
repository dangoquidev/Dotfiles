# hyprlock — dark & pink (colors match lua/theme.lua)
#   pink   #ff8fa3   light pink #ffd1dc   bg #1a1a2a   text #e0def4   red #f7768e

$pink  = rgb(ff8fa3)
$pink2 = rgb(ffd1dc)
$bg    = rgba(1a1a2acc)
$text  = rgb(e0def4)
$red   = rgb(f7768e)
$font  = Maple Mono NF CN

general {
    hide_cursor = true
}

# Everything appears at once, no fade-ins
animations {
    enabled = false
}

# Pre-blurred, darkened small copy of the current wallpaper, made by
# scripts/wallpaper.sh: loads instantly and costs no blur pass at lock time.
background {
    monitor =
    path = ~/.cache/hypr/lock.jpg
    color = rgb(1a1a2a)
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = $TIME
    color = $pink
    font_size = 96
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $pink2
    font_size = 18
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $pink
    inner_color = $bg
    font_color = $text
    font_family = $font
    check_color = $pink2
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    placeholder_text = <span foreground="##e0def4aa"><i>󰌾  $USER</i></span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}
