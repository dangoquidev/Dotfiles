<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  One font everywhere: Maple Mono NF CN (AUR maplemono-nf-cn)
    ligatures (-> => == != >= …), Nerd Font icons, Chinese and Japanese glyphs built in.
  Color emoji fall back to Noto Color Emoji (noto-fonts-emoji): no monospace font has them.
-->
<fontconfig>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- apps asking for Maple by name still get color emoji -->
  <match target="pattern">
    <test name="family" compare="contains"><string>Maple Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
